<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clickworks — Coming soon</title>
    <meta name="description" content="Clickworks is on its way. Find us on social in the meantime." />
    <meta name="theme-color" content="#060a15" />

    <meta property="og:title" content="Clickworks — Coming soon" />
    <meta property="og:description" content="Clickworks is on its way." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" href="assets/clickworks-white.png" />
    <link rel="preload" href="assets/InterVariable.woff2" as="font" type="font/woff2" crossorigin />

    <style>
      /*
        Deliberately a single static page: no build step and no dependencies,
        so a holding page cannot break while it is the only thing online.
        Type, logo and gradient are lifted verbatim from the main site.
      */
      @font-face {
        font-family: "Inter";
        src: url("assets/InterVariable.woff2") format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }

      *,
      *::before,
      *::after { box-sizing: border-box; }

      html { -webkit-text-size-adjust: 100%; }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 3rem 1.25rem;
        font-family: Inter, "Helvetica Neue", Arial, sans-serif;
        /* The Display optical size, matching the main site. */
        font-variation-settings: "opsz" 32;
        -webkit-font-smoothing: antialiased;
        text-align: center;
        color: #fff;
        background-color: #060a15;
        background-image:
          /* blue lobe sweeping out of the top-right corner */
          radial-gradient(
            70% 62% at 104% 1%,
            rgba(181, 203, 255, 0.95) 0%,
            rgba(107, 144, 248, 0.7) 24%,
            rgba(30, 60, 160, 0.42) 48%,
            rgba(6, 10, 21, 0) 76%
          ),
          /* lilac haze hugging the bottom-right corner */
          radial-gradient(
            58% 34% at 97% 93%,
            rgba(211, 133, 165, 0.8) 0%,
            rgba(150, 90, 160, 0.42) 38%,
            rgba(6, 10, 21, 0) 72%
          ),
          /* magenta core on the right edge, below centre */
          radial-gradient(
            52% 32% at 105% 68%,
            rgba(168, 30, 104, 0.85) 0%,
            rgba(110, 14, 99, 0.55) 34%,
            rgba(6, 10, 21, 0) 70%
          ),
          /* violet band grazing the bottom edge */
          radial-gradient(
            85% 22% at 22% 106%,
            rgba(104, 119, 202, 0.5) 0%,
            rgba(50, 36, 104, 0.3) 42%,
            rgba(6, 10, 21, 0) 74%
          );
        background-attachment: fixed;
      }

      main { width: 100%; max-width: 46rem; }

      h1 { margin: 0; line-height: 0; }

      .wordmark {
        width: min(70vw, 34rem);
        height: auto;
      }

      .lede {
        margin: 2.5rem 0 0;
        font-size: clamp(1.375rem, 4.5vw, 1.875rem);
        font-weight: 300;
        letter-spacing: -0.01em;
      }

      .blurb {
        margin: 1rem auto 0;
        max-width: 46ch;
        font-size: clamp(1rem, 3vw, 1.125rem);
        font-weight: 300;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.7);
      }

      .contact {
        display: inline-block;
        margin-top: 2rem;
        color: #fff;
        font-size: 1rem;
        text-underline-offset: 4px;
      }
      .contact:hover { color: rgba(255, 255, 255, 0.7); }

      .socials {
        margin-top: 2.75rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
      }

      .handle {
        font-size: 0.875rem;
        font-weight: 300;
        color: rgba(255, 255, 255, 0.6);
      }

      .socials a {
        display: inline-flex;
        color: rgba(255, 255, 255, 0.7);
        transition: color 0.2s;
      }
      .socials a:hover { color: #fff; }
      .socials svg { width: 20px; height: 20px; }

      /* Visible keyboard focus on every interactive element. */
      a:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 4px;
        border-radius: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        * { transition-duration: 0.001ms !important; }
      }
    </style>
  </head>

  <body>
    <main>
      <h1>
        <img
          class="wordmark"
          src="assets/clickworks-white.png"
          alt="Clickworks"
          width="1572"
          height="244"
        />
      </h1>

      <p class="lede">Coming soon</p>

      <p class="blurb">
        We are putting the finishing touches to the new site. In the meantime,
        you can find us on social.
      </p>

      <div class="socials">
        <span class="handle">@getclickworks</span>

        <a
          href="https://www.instagram.com/getclickworks"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Clickworks on Instagram (opens in a new tab)"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect width="20" height="20" x="2" y="2" rx="5" ry="5" />
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" />
            <line x1="17.5" x2="17.51" y1="6.5" y2="6.5" />
          </svg>
        </a>

        <a
          href="https://www.tiktok.com/@getclickworks"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Clickworks on TikTok (opens in a new tab)"
        >
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z" />
          </svg>
        </a>

        <a
          href="https://x.com/getclickworks"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Clickworks on X (opens in a new tab)"
        >
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z" />
          </svg>
        </a>

        <a
          href="https://www.linkedin.com/company/getclickworks"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Clickworks on LinkedIn (opens in a new tab)"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" />
            <rect width="4" height="12" x="2" y="9" />
            <circle cx="4" cy="4" r="2" />
          </svg>
        </a>
      </div>
    </main>
  </body>
</html>
